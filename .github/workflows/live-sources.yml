name: Live source check

# Týdenní kontrola, který ze zdrojů přestal fungovat (web změnil HTML, doménu, zablokoval přístup).
# Běží proti SKUTEČNÝM webům, proto nikdy neblokuje PR ani push - výsledkem je jen report
# (viz app/src/test/.../LiveSourceSmokeTest.kt). Zdroje za Cloudflare výzvou se v CI bez WebView
# nedají projít a jsou v reportu označené CLOUDFLARE, ne jako chyba.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Akce jsou zafixované na commit SHA (komentář za # je původní tag), stejně jako v android-tests.yml.
jobs:
  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run live source check
        run: ./gradlew testDebugUnitTest --tests "com.haise.jiyu.source.LiveSourceSmokeTest" -Djiyu.live=true --stacktrace

      - name: Show report in job summary
        if: always()
        run: |
          if [ -f app/build/reports/live-sources.md ]; then
            cat app/build/reports/live-sources.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Report nevznikl (test se nespustil)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-sources-report
          path: app/build/reports/live-sources.md
          retention-days: 30
          if-no-files-found: warn
