name: Live source check

# Týdenní kontrola, který ze zdrojů přestal fungovat (web změnil HTML, doménu, zablokoval přístup).
# Běží proti SKUTEČNÝM webům, proto nikdy neblokuje PR ani push - výsledkem je jen report
# (viz app/src/test/.../LiveSourceSmokeTest.kt). Zdroje za Cloudflare výzvou se v CI bez WebView
# nedají projít a jsou v reportu označené CLOUDFLARE, ne jako chyba.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Akce jsou zafixované na commit SHA (komentář za # je původní tag), stejně jako v android-tests.yml.
jobs:
  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Viz android-tests.yml - fiktivni SUPABASE_URL/ANON_KEY, aby BuildConfig nehlasil
      # placeholder konfiguraci (realny klient by hlasil isConfigured=false).
      - name: Create local.properties stubs
        run: |
          echo "SUPABASE_URL=https://ci-test.supabase.co" > local.properties
          echo "SUPABASE_ANON_KEY=ci-test-anon-key" >> local.properties

      - name: Run live source check
        run: ./gradlew testDebugUnitTest --tests "com.haise.jiyu.source.LiveSourceSmokeTest" -Djiyu.live=true --stacktrace

      - name: Show report in job summary
        if: always()
        run: |
          if [ -f app/build/reports/live-sources.md ]; then
            cat app/build/reports/live-sources.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Report nevznikl (test se nespustil)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-sources-report
          path: app/build/reports/live-sources.md
          retention-days: 30
          if-no-files-found: warn
