name: Android unit tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Nejnižší potřebná práva pro GITHUB_TOKEN; checks: write potřebuje jen dorny/test-reporter.
permissions:
  contents: read
  checks: write

# Akce jsou zafixované na commit SHA (komentář za # je původní tag) - pohyblivý tag jako @v4 by
# šel přepsat a do CI by se dostal cizí kód. Aktualizace hlídá .github/dependabot.yml.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ověří, že gradle-wrapper.jar v repozitáři je oficiální (kontrolní součty Gradlu) - podvržený
      # wrapper by jinak spustil libovolný kód při každém buildu v CI.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Java 21, ne 17. Robolectric si bere uroven Android SDK z targetSdk (36) a jeho
      # android-all jar pro API 36 je prelozeny pro Javu 21 - na 17 odmitne vytvorit sandbox
      # a VSECHNY Robolectric tridy spadnou uz na classMethod:
      #   "Failed to create a Robolectric sandbox: Android SDK 36 requires Java 21 (have Java 17)"
      #
      # Lokalne to neprasklo, protoze Android Studio pouziva vlastni JBR 21 - CI tedy bezelo na
      # JINE Jave nez vyvoj a prave ten rozdil chybu propustil az do vydani v1.0.0. Az se bude
      # menit targetSdk, zkontroluj, jestli Robolectric nechce zase novejsi Javu.
      #
      # jvmTarget/sourceCompatibility zustavaji na 17 - to je bytekod, ktery se vyrabi, ne JDK,
      # pod kterym bezi Gradle.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # local.properties neni v repu (obsahuje citlive udaje) - bez nej BuildConfig dostane
      # "placeholder" hodnoty a realny GeminiTranslateClient hlasi isConfigured=false. Testy
      # pocitajici s nakonfigurovanou proxy (TR-8) pak spadnou na NPE, protoze request se
      # nikdy neposle. Hodnoty jsou fiktivni - HTTP volani odchytavaji fake interceptory.
      - name: Create local.properties stubs
        run: |
          echo "SUPABASE_URL=https://ci-test.supabase.co" > local.properties
          echo "SUPABASE_ANON_KEY=ci-test-anon-key" >> local.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 14

      - name: Publish test report summary
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Unit test results
          path: app/build/test-results/testDebugUnitTest/*.xml
          reporter: java-junit
          fail-on-error: false

  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ověří, že gradle-wrapper.jar v repozitáři je oficiální (kontrolní součty Gradlu) - podvržený
      # wrapper by jinak spustil libovolný kód při každém buildu v CI.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # GitHub-hosted ubuntu runnery maji od 2023 povolenou vnorenou virtualizaci, ale KVM
      # zarizeni je bez tohohle pravidla pristupne jen rootu - emulator by bez akcelerace
      # bezel v softwarovem rezimu a boot by trval radove desitky minut misto jednotek.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache AVD snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-${{ runner.os }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties stubs
        run: |
          echo "SUPABASE_URL=https://ci-test.supabase.co" > local.properties
          echo "SUPABASE_ANON_KEY=ci-test-anon-key" >> local.properties

      # Cely androidTest balik (10 translate probe testu + LibraryScreenTest/ReaderSmokeTest)
      # potrebuje realny Bitmap/Canvas a ML Kit OCR - nejde spustit jako JVM unit test
      # (viz `test` job vyse), proto samostatny job s emulatorem.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          retention-days: 14

      - name: Publish instrumented test report summary
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Instrumented test results
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          reporter: java-junit
          fail-on-error: false
